name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'tests/e2e/package.json') }}
      - name: Start PostgreSQL/PostGIS
        run: cp .env.example .env && docker compose up -d db
      - name: API integration, constraints, migration, seed and concurrency
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm test-api
      - name: Python lint and types
        run: |
          python -m pip install -r apps/api/requirements.txt
          python -m pip install -e './apps/api[dev]'
          ruff check apps/api
          cd apps/api && mypy reliefgrid
      - name: Web build, TypeScript and component tests
        run: docker compose -f compose.yaml -f compose.test.yaml run --build --rm test-web
      - name: Python dependency audit
        run: python -m pip install pip-audit && pip-audit
      - name: Web dependency audit
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high
      - name: Start API and web for end-to-end verification
        run: |
          docker compose up --build -d api web
          docker compose exec -T api python -m reliefgrid.seed
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready && curl -fsS http://localhost:3000; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Playwright browser tests
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && npm test
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
