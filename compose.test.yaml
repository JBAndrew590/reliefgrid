services:
  test-api:
    build:
      context: ./apps/api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/tests:/app/tests:ro
    command: ["sh", "-c", "pip install -e '.[dev]' && alembic upgrade head && pytest -q"]
  test-web:
    build:
      context: ./apps/web
      target: build
    command: ["sh", "-c", "npm run typecheck && npm run test && npm run build"]
